services:
  drawdb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: drawdb-local:latest
    container_name: drawdb
    ports:
      - "8080:80"

  postgres:
    image: postgres:latest
    container_name: drawdb-postgres
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: admin1234
      POSTGRES_DB: shopping
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./seed:/seed:ro

volumes:
  pgdata:
