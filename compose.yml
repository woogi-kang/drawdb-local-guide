services:
  drawdb:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: drawdb-local:latest
    container_name: drawdb
    ports:
      - "8080:80"

  postgres:
    image: postgres:latest
    container_name: drawdb-postgres
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
